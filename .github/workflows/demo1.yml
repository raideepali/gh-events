name: Events Demo 1
on:
  pull_request:
    types: opened
    branches:
      - main #main branch
      - "dev-*" # dev-new, dev-1, dev-2, etc.
      - "feat/**" #feat/feature1, feat/feature2/new, etc.
      # developer-1
  workflow_dispatch:
  push:
    branches:
      - main #main branch
      - "dev-*" # dev-new, dev-1, dev-2, etc.
      - "feat/**" #feat/feature1, feat/feature2/new, etc.
      # developer-1
    paths-ignore:
      - ".github/workflows/demo1.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."
